<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A writing by Tarheel Maker.">
  <title>Writing — Tarheel Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
  <style>
    :root { --night: #211b17; --clay: #a95835; --linen: #f3eee5; --muted: #6d6259; --max: 850px; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--night); background: var(--linen); font-family: 'DM Sans', sans-serif; }
    .wrap { width: min(var(--max), calc(100% - 42px)); margin: auto; }
    a { color: inherit; text-decoration: none; }
    .mono { font: 600 11px 'DM Sans', sans-serif; letter-spacing: 0; text-transform: uppercase; }
    header { padding: 27px 0; border-bottom: 1px solid rgba(33,27,23,.2); }
    .back { color: var(--clay); }
    main { padding: 105px 0; }
    .meta { color: var(--muted); }
    h1 { max-width: 760px; margin: 20px 0 28px; font: 600 clamp(50px, 8vw, 84px)/.98 'Newsreader', serif; }
    .writing-cover { display: flex; max-width: 650px; max-height: 440px; justify-content: center; margin: 0 auto 34px; overflow: hidden; }
    .writing-cover[hidden] { display: none; }
    .writing-cover img { width: auto; max-width: 100%; max-height: 440px; object-fit: contain; }
    article { max-width: 650px; margin: auto; }
    article p { color: #514940; font-size: 17px; line-height: 1.8; }
    article .summary { color: var(--night); font: 500 23px/1.45 'Newsreader', serif; }
    .rule { margin: 55px 0; border: 0; border-top: 1px solid rgba(33,27,23,.2); }
    footer { padding: 25px 0; color: #cfc5ba; background: #0f0d0c; font: 10px 'DM Mono', monospace; text-transform: uppercase; }
    @media (max-width: 800px) { main { padding: 75px 0; } }
  </style>
  <script src="../scripts/posts.js" defer></script>
  <script src="../scripts/site-shell.js" defer></script>
</head>
<body>
  <header><div class="wrap"><a class="back mono" href="writings.html">&larr; All writings</a></div></header>
  <main data-writing-detail>
    <div class="wrap">
      <div class="meta mono" data-writing-meta></div>
      <h1 data-writing-title>Loading writing...</h1>
      <figure class="writing-cover" data-writing-cover hidden><img data-writing-image alt=""></figure>
      <article>
        <p class="summary" data-writing-summary></p>
        <hr class="rule">
        <div data-writing-body></div>
      </article>
    </div>
  </main>
  <footer><div class="wrap">&copy; 2026 Tarheel Maker</div></footer>
</body>
</html>
