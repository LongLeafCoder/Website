<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Contact Joshua Young about design, writing, and woodworking projects."
    />
    <title>Contact — Tarheel Maker</title>
    <link rel="preconn
    ect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="../scripts/site-shell.js" defer></script>
    <script src="../scripts/contact-form.js" defer></script>
    <style>
      :root {
        --night: #211b17;
        --clay: #a95835;
        --sun: #efc8a8;
        --linen: #f3eee5;
        --muted: #6d6259;
        --max: 1240px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--night);
        background: var(--linen);
        font-family: Manrope, sans-serif;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .wrap {
        width: min(var(--max), calc(100% - 72px));
        margin: auto;
      }
      .mono {
        font:
          500 11px/1.2 "DM Mono",
          monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      header {
        position: fixed;
        z-index: 4;
        top: 0;
        width: 100%;
        color: var(--linen);
        background: rgba(33, 27, 23, 0.96);
        border-bottom: 1px solid rgba(243, 238, 229, 0.16);
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 94px;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 600;
      }
      .mark-symbol {
        display: grid;
        place-items: center;
        width: 37px;
        height: 37px;
        border: 1px solid;
        border-radius: 50%;
      }
      nav {
        display: flex;
        gap: 31px;
        font:
          11px "DM Mono",
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      nav a {
        opacity: 0.8;
      }
      nav a:hover {
        opacity: 1;
      }
      .menu {
        display: none;
        border: 0;
        background: none;
        color: inherit;
        font:
          22px "DM Mono",
          monospace;
      }
      .page {
        padding: 150px 0 120px;
      }
      .contact-layout {
        display: grid;
        gap: 76px;
      }
      .contact-top {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
        align-items: center;
        gap: clamp(42px, 7vw, 100px);
      }
      .contact-copy h1 {
        margin: 18px 0 24px;
        font-size: 76px;
        line-height: 0.94;
        letter-spacing: 0;
      }
      .contact-copy p {
        max-width: 430px;
        color: #514940;
        font-size: 17px;
        line-height: 1.75;
      }
      .contact-copy a {
        color: var(--clay);
        border-bottom: 1px solid currentColor;
      }
      .contact-image {
        position: relative;
        width: min(100%, 380px);
        margin: 0 auto;
        overflow: hidden;
        background: #302720;
        animation: image-arrive 800ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .contact-image img {
        display: block;
        width: 100%;
        height: auto;
        transition: transform 800ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .contact-image:hover img {
        transform: scale(1.04);
      }
      .contact-image figcaption {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 34px 18px 15px;
        color: var(--linen);
        background: linear-gradient(transparent, rgba(25, 21, 18, 0.78));
        font:
          500 10px/1.4 "DM Mono",
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .contact-copy {
        animation: copy-arrive 700ms 120ms ease-out both;
      }
      .contact-form-section {
        width: min(780px, 100%);
        margin: 0 auto;
        animation: copy-arrive 700ms 240ms ease-out both;
      }
      .form-heading {
        margin: 0 0 25px;
        text-align: center;
      }
      .form-heading .mono {
        color: var(--clay);
      }
      .form-heading h2 {
        margin: 12px 0 8px;
        font:
          600 42px/1.1 Manrope,
          sans-serif;
        letter-spacing: 0;
      }
      .form-heading p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      .contact-form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px 20px;
        width: 100%;
        padding: 38px;
        border-top: 4px solid var(--clay);
        background: var(--night);
        color: var(--linen);
        box-shadow: 16px 16px 0 rgba(169, 88, 53, 0.14);
      }
      .field {
        display: grid;
        gap: 9px;
      }
      .field-message,
      .verification,
      .form-status,
      .button {
        grid-column: 1 / -1;
      }
      label {
        margin-top: 5px;
        color: #d8d0c5;
        font:
          10px "DM Mono",
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      input,
      textarea {
        grid-column: 1/-1;
        width: 100%;
        padding: 12px 0;
        border: 0;
        border-bottom: 1px solid rgba(243, 238, 229, 0.4);
        outline: 0;
        color: var(--linen);
        background: transparent;
        font:
          15px Manrope,
          sans-serif;
      }
      input {
        grid-column: auto;
      }
      .field input,
      .field textarea {
        grid-column: auto;
        transition:
          border-color 180ms ease,
          box-shadow 180ms ease;
      }
      .field input:focus-visible,
      .field textarea:focus-visible {
        border-bottom-color: var(--sun);
        box-shadow: 0 1px 0 var(--sun);
      }
      textarea {
        resize: vertical;
      }
      .verification {
        min-height: 65px;
      }
      .form-status {
        min-height: 24px;
        margin: 0;
        color: #d8d0c5;
        font-size: 13px;
        line-height: 1.5;
      }
      .form-status[data-state="error"] {
        color: #ffb49e;
      }
      .form-status[data-state="success"] {
        color: #b9dfb1;
      }
      .button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .form-trap {
        position: absolute;
        left: -10000px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      .button {
        grid-column: 1/-1;
        justify-self: start;
        margin-top: 14px;
        min-height: 48px;
        padding: 0 19px;
        border: 1px solid var(--linen);
        color: var(--linen);
        background: transparent;
        cursor: pointer;
        transition:
          color 180ms ease,
          background 180ms ease,
          transform 180ms ease,
          opacity 180ms ease;
        font:
          11px "DM Mono",
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .button:hover {
        color: var(--night);
        background: var(--linen);
        transform: translateY(-2px);
      }
      .button span {
        display: inline-block;
        transition: transform 180ms ease;
      }
      .button:hover span {
        transform: translate(2px, -2px);
      }
      @keyframes image-arrive {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes copy-arrive {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
      @media (max-width: 800px) {
        .wrap {
          width: calc(100% - 36px);
        }
        .page {
          padding: 120px 0 80px;
        }
        .contact-layout {
          gap: 58px;
        }
        .contact-top {
          grid-template-columns: 1fr;
          gap: 28px;
        }
        .contact-image {
          order: 1;
          width: min(100%, 300px);
        }
        .contact-copy {
          order: 0;
        }
        .contact-copy h1 {
          font-size: 58px;
        }
        .form-heading h2 {
          font-size: 36px;
        }
        .contact-form {
          padding: 28px 24px;
          grid-template-columns: 1fr;
        }
        input {
          grid-column: 1;
        }
      }
    </style>
  </head>
  <body>
    <header></header>
    <main class="page">
      <div class="wrap contact-layout">
        <section class="contact-top" aria-label="Contact introduction">
          <figure class="contact-image">
            <img
              src="../assets/background/1000015039.webp"
              alt="Looking up through a dense green tree canopy toward the sky"
              width="1600"
              height="1600"
            />
            <figcaption>
              <span>A moment to look up</span>
              <span>Notes from outside</span>
            </figcaption>
          </figure>
          <div class="contact-copy">
            <div class="mono">04 / Contact</div>
            <h1>Let’s talk<br />about the work.</h1>
            <p>
              For design collaborations, writing projects, custom woodworking,
              or a thoughtful hello, send a note and I’ll get back to you.
            </p>
          </div>
        </section>
        <section
          class="contact-form-section"
          aria-labelledby="contact-form-title"
        >
          <div class="form-heading">
            <div class="mono">Your message</div>
            <h2 id="contact-form-title">Send a note.</h2>
            <p>Share a little about what you have in mind.</p>
          </div>
          <form
            id="contact-form"
            class="contact-form"
            action="/api/contact"
            method="post"
          >
            <div class="field">
              <label for="name">Name</label>
              <input
                id="name"
                name="name"
                type="text"
                autocomplete="name"
                maxlength="100"
                required
              />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                maxlength="254"
                required
              />
            </div>
            <div class="field field-message">
              <label for="message">Message</label>
              <textarea
                id="message"
                name="message"
                rows="7"
                maxlength="5000"
                required
              ></textarea>
            </div>
            <div class="form-trap" aria-hidden="true">
              <label for="company">Leave this field empty</label>
              <input
                id="company"
                name="company"
                tabindex="-1"
                autocomplete="off"
              />
            </div>
            <div class="verification">
              <div id="turnstile-widget"></div>
            </div>
            <p
              id="form-status"
              class="form-status"
              role="status"
              aria-live="polite"
            >
              Preparing the secure form…
            </p>
            <button class="button" type="submit" disabled>
              Send message <span aria-hidden="true">↗</span>
            </button>
          </form>
        </section>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
